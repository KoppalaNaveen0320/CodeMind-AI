<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — CodeMind AI</title>
    <meta name="description" content="Sign in to your CodeMind AI workspace." />
    <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card-wrap">
      <div class="auth-brand">
        <span class="brand-mark"><span></span></span>
        <span class="logo-text">CodeMind <b>AI</b></span>
      </div>

      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Sign in to access your repositories and code intelligence.</p>
      </div>

      <div class="auth-error-banner" id="login-error-banner">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="login-error-text">Invalid email or password.</span>
      </div>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-input"
            placeholder="alex@acme.dev"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrap">
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle-btn"
              id="login-password-toggle"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="icon eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-btn-primary" id="login-submit-btn">
          <span>Sign In</span>
          <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="auth-footer">
        Don’t have an account? <a href="/signup">Create an account</a>
      </div>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('login-submit-btn');
      const errorBanner = document.getElementById('login-error-banner');
      const errorText = document.getElementById('login-error-text');
      const passwordInput = document.getElementById('login-password');
      const toggleBtn = document.getElementById('login-password-toggle');

      const EYE_SVG = '<svg class="icon eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      const EYE_OFF_SVG = '<svg class="icon eye-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          const newLabel = isPassword ? 'Hide password' : 'Show password';
          toggleBtn.setAttribute('aria-label', newLabel);
          toggleBtn.setAttribute('title', newLabel);
          toggleBtn.innerHTML = isPassword ? EYE_OFF_SVG : EYE_SVG;
          passwordInput.focus();
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.remove('visible');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Signing in...</span>';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || data.message || 'Authentication failed');
          }

          if (data.token) {
            localStorage.setItem('codemind_auth_token', data.token);
          }
          window.location.href = '/dashboard';
        } catch (err) {
          errorText.textContent = err.message || 'Sign in failed. Please verify credentials.';
          errorBanner.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In</span> <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
        }
      });
    </script>
  </body>
</html>
