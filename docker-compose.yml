version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: codemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codemind_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codemind_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codemind-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codemind-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "CodeMind AI"
      APP_ENV: production
      DEBUG: "false"
      APP_PORT: 8000
      REQUIRE_AUTH: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-codemind_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-env-to-32-chars!}
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5:3b
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSION: 768
      RATE_LIMIT_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploaded_repos:/app/storage/uploaded_repos
      - app_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - codemind-net

volumes:
  pgdata:
    driver: local
  uploaded_repos:
    driver: local
  app_data:
    driver: local

networks:
  codemind-net:
    driver: bridge
